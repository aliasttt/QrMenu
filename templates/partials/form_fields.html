{% load i18n %}
<div>
  <label for="{{ name }}" class="label-field block text-sm font-medium text-slate-700 dark:text-slate-300 mb-1">{{ label }}</label>
  {% if field_type == "textarea" %}
    <textarea
      id="{{ name }}"
      name="{{ name }}"
      rows="{{ rows|default:'4' }}"
      placeholder="{{ placeholder|default:'' }}"
      class="input-field w-full rounded-xl border border-slate-300 dark:border-slate-600 bg-white dark:bg-slate-700 px-4 py-2.5 text-slate-900 dark:text-white placeholder-slate-500 dark:placeholder-slate-400 focus:border-primary-500 focus:ring-1 focus:ring-primary-500 dark:focus:border-orange-500 dark:focus:ring-orange-500">{{ value|default:'' }}</textarea>
  {% elif field_type == "password" %}
    <div class="relative">
      <input
        id="{{ name }}"
        name="{{ name }}"
        type="password"
        value="{{ value|default:'' }}"
        placeholder="{{ placeholder|default:'' }}"
        class="input-field w-full rounded-xl border border-slate-300 dark:border-slate-600 bg-white dark:bg-slate-700 pl-4 pr-11 py-2.5 text-slate-900 dark:text-white placeholder-slate-500 dark:placeholder-slate-400 focus:border-primary-500 focus:ring-1 focus:ring-primary-500 dark:focus:border-orange-500 dark:focus:ring-orange-500"
      >
      <button type="button" aria-label="{% trans 'Toggle password visibility' %}"
        onclick="(function(b){var i=b.parentNode.querySelector('input');var s=b.querySelector('.eye-show');var h=b.querySelector('.eye-hide');if(i.type==='password'){i.type='text';s.classList.add('hidden');h.classList.remove('hidden');}else{i.type='password';s.classList.remove('hidden');h.classList.add('hidden');}})(this)"
        class="absolute inset-y-0 right-0 flex items-center pr-3 text-slate-500 hover:text-slate-700 dark:text-slate-400 dark:hover:text-slate-200 focus:outline-none">
        <svg class="eye-show w-5 h-5" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="1.5" stroke="currentColor">
          <path stroke-linecap="round" stroke-linejoin="round" d="M2.036 12.322a1.012 1.012 0 010-.639C3.423 7.51 7.36 4.5 12 4.5c4.638 0 8.573 3.007 9.963 7.178.07.207.07.431 0 .639C20.577 16.49 16.64 19.5 12 19.5c-4.638 0-8.573-3.007-9.963-7.178z" />
          <path stroke-linecap="round" stroke-linejoin="round" d="M15 12a3 3 0 11-6 0 3 3 0 016 0z" />
        </svg>
        <svg class="eye-hide w-5 h-5 hidden" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="1.5" stroke="currentColor">
          <path stroke-linecap="round" stroke-linejoin="round" d="M3.98 8.223A10.477 10.477 0 001.934 12C3.226 16.338 7.244 19.5 12 19.5c.993 0 1.953-.138 2.863-.395M6.228 6.228A10.451 10.451 0 0112 4.5c4.756 0 8.773 3.162 10.065 7.498a10.522 10.522 0 01-4.293 5.774M6.228 6.228L3 3m3.228 3.228l3.65 3.65m7.894 7.894L21 21m-3.228-3.228l-3.65-3.65m0 0a3 3 0 10-4.243-4.243m4.242 4.242L9.88 9.88" />
        </svg>
      </button>
    </div>
  {% else %}
    <input
      id="{{ name }}"
      name="{{ name }}"
      type="{{ field_type|default:'text' }}"
      value="{{ value|default:'' }}"
      placeholder="{{ placeholder|default:'' }}"
      class="input-field w-full rounded-xl border border-slate-300 dark:border-slate-600 bg-white dark:bg-slate-700 px-4 py-2.5 text-slate-900 dark:text-white placeholder-slate-500 dark:placeholder-slate-400 focus:border-primary-500 focus:ring-1 focus:ring-primary-500 dark:focus:border-orange-500 dark:focus:ring-orange-500"
    >
  {% endif %}
</div>
