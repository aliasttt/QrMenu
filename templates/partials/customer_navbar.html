{% load static i18n %}
<header
  class="sticky top-0 z-40 border-b border-slate-100 bg-white/95 backdrop-blur-md dark:border-slate-700 dark:bg-slate-900/95"
  x-data="customerNavbar()"
  x-init="init()"
>
  <nav class="mx-auto flex max-w-7xl items-center justify-between gap-3 px-4 py-3 sm:px-6 lg:px-8" aria-label="Customer">
    <a href="{% url 'restaurants_list' %}" class="flex items-center gap-2.5 font-bold text-slate-900 dark:text-white">
      <span class="inline-flex h-9 w-9 items-center justify-center rounded-xl bg-gradient-to-br from-orange-500 via-orange-600 to-amber-500 text-white shadow-md ring-1 ring-orange-200/70 dark:ring-orange-500/30">Q</span>
      <span class="hidden sm:inline text-lg font-extrabold tracking-tight">QRMenu</span>
    </a>

    <div class="hidden items-center gap-1 md:flex">
      <a href="{% url 'restaurants_list' %}" class="rounded-full px-3 py-2 text-sm font-medium text-slate-600 hover:text-orange-600 dark:text-slate-300 dark:hover:text-orange-400">{% trans "Restaurants" %}</a>
      <template x-if="currentUser">
        <button @click="ordersOpen = true" class="rounded-full px-3 py-2 text-sm font-medium text-slate-600 hover:text-orange-600 dark:text-slate-300 dark:hover:text-orange-400">{% trans "My orders" %}</button>
      </template>
      <template x-if="currentUser">
        <button @click="profileOpen = true" class="rounded-full px-3 py-2 text-sm font-medium text-slate-600 hover:text-orange-600 dark:text-slate-300 dark:hover:text-orange-400">{% trans "Profile" %}</button>
      </template>
    </div>

    <div class="flex items-center gap-2">
      <template x-if="!currentUser">
        <button @click="openAuthModal('login')" class="rounded-xl border border-slate-200 bg-white px-3 py-2 text-sm font-semibold text-slate-800 shadow-sm hover:bg-slate-50 dark:border-slate-600 dark:bg-slate-800 dark:text-slate-100">{% trans "Log in" %}</button>
      </template>
      <template x-if="!currentUser">
        <button @click="openAuthModal('register')" class="rounded-xl bg-orange-600 px-3 py-2 text-sm font-bold text-white shadow-sm hover:bg-orange-700">{% trans "Register" %}</button>
      </template>
      <template x-if="currentUser">
        <div class="relative" @click.outside="userMenuOpen = false">
          <button @click="userMenuOpen = !userMenuOpen" class="flex items-center gap-2 rounded-xl border border-slate-200 bg-white px-3 py-2 text-sm font-semibold text-slate-800 shadow-sm hover:bg-slate-50 dark:border-slate-600 dark:bg-slate-800 dark:text-slate-100">
            <span class="inline-flex h-6 w-6 items-center justify-center rounded-full bg-orange-500 text-xs font-black text-white" x-text="(currentUser.first_name || currentUser.email || '?').slice(0,1).toUpperCase()"></span>
            <span class="hidden sm:inline" x-text="currentUser.first_name || currentUser.email"></span>
            <svg class="h-3 w-3" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 9l-7 7-7-7"/></svg>
          </button>
          <div x-cloak x-show="userMenuOpen" class="absolute right-0 mt-2 w-56 rounded-xl border border-slate-200 bg-white p-1 shadow-lg dark:border-slate-700 dark:bg-slate-900">
            <button @click="profileOpen = true; userMenuOpen = false" class="flex w-full items-center gap-2 rounded-lg px-3 py-2 text-left text-sm hover:bg-slate-50 dark:hover:bg-slate-800">👤 {% trans "My profile" %}</button>
            <button @click="ordersOpen = true; userMenuOpen = false" class="flex w-full items-center gap-2 rounded-lg px-3 py-2 text-left text-sm hover:bg-slate-50 dark:hover:bg-slate-800">🧾 {% trans "My orders" %}</button>
            <a href="{% url 'restaurants_list' %}" class="flex items-center gap-2 rounded-lg px-3 py-2 text-sm hover:bg-slate-50 dark:hover:bg-slate-800">🍽️ {% trans "Restaurants" %}</a>
            <button @click="doLogout()" class="flex w-full items-center gap-2 rounded-lg px-3 py-2 text-left text-sm text-rose-600 hover:bg-rose-50 dark:hover:bg-rose-900/20">{% trans "Log out" %}</button>
          </div>
        </div>
      </template>
    </div>
  </nav>

  <!-- Auth modal (teleported to body to escape header stacking context) -->
  <template x-teleport="body">
  <div x-cloak x-show="authOpen" class="fixed inset-0 z-[9999] overflow-y-auto bg-slate-900/70 p-4" @click.self="authOpen = false">
    <div class="mx-auto my-8 w-full max-w-md rounded-2xl bg-white p-6 shadow-2xl dark:bg-slate-900" @click.stop>
      <div class="mb-4 flex items-center justify-between">
        <h3 class="text-lg font-black text-slate-900 dark:text-white"
          x-text="authMode === 'login' ? '{% trans "Log in" %}' : (authMode === 'register' ? '{% trans "Create account" %}' : (authMode === 'forgot' ? '{% trans "Forgot password" %}' : (authMode === 'reset_code' ? '{% trans "Enter reset code" %}' : '{% trans "New password" %}')))"></h3>
        <button @click="authOpen = false" class="rounded-lg p-1 text-slate-500 hover:bg-slate-100 dark:hover:bg-slate-800">✕</button>
      </div>
      <div class="mb-4 flex rounded-xl bg-slate-100 p-1 dark:bg-slate-800" x-show="authMode === 'login' || authMode === 'register'">
        <button @click="authMode = 'login'; authError = ''" :class="authMode === 'login' ? 'bg-white shadow dark:bg-slate-900' : ''" class="flex-1 rounded-lg py-2 text-sm font-semibold text-slate-800 dark:text-slate-200">{% trans "Log in" %}</button>
        <button @click="authMode = 'register'; authError = ''" :class="authMode === 'register' ? 'bg-white shadow dark:bg-slate-900' : ''" class="flex-1 rounded-lg py-2 text-sm font-semibold text-slate-800 dark:text-slate-200">{% trans "Register" %}</button>
      </div>
      <template x-if="authMode === 'login'">
        <div class="space-y-3">
          <input type="text" x-model="authIdentifier" placeholder="{% trans 'Email or phone' %}" class="w-full rounded-xl border border-slate-200 bg-slate-50 px-4 py-2.5 text-sm dark:border-slate-600 dark:bg-slate-800 dark:text-white">
          <input type="password" x-model="authPassword" placeholder="{% trans 'Password' %}" class="w-full rounded-xl border border-slate-200 bg-slate-50 px-4 py-2.5 text-sm dark:border-slate-600 dark:bg-slate-800 dark:text-white" @keydown.enter="doLogin()">
          <p x-show="authError" x-text="authError" class="rounded-lg bg-rose-50 px-3 py-2 text-xs font-semibold text-rose-700 dark:bg-rose-900/30 dark:text-rose-300"></p>
          <button @click="doLogin()" :disabled="authLoading" class="w-full rounded-xl bg-orange-600 py-3 text-sm font-bold text-white hover:bg-orange-700 disabled:opacity-50">
            <span x-show="!authLoading">{% trans "Log in" %}</span>
            <span x-show="authLoading">{% trans "Logging in..." %}</span>
          </button>
          <button type="button" @click="authMode = 'forgot'; authError = ''; forgotEmail = authIdentifier.includes('@') ? authIdentifier : ''" class="w-full text-center text-xs font-semibold text-orange-600 hover:underline">{% trans "Forgot password?" %}</button>
        </div>
      </template>
      <template x-if="authMode === 'register'">
        <div class="space-y-3">
          <div class="grid grid-cols-2 gap-2">
            <input type="text" x-model="regFirstName" placeholder="{% trans 'First name' %}" class="w-full rounded-xl border border-slate-200 bg-slate-50 px-4 py-2.5 text-sm dark:border-slate-600 dark:bg-slate-800 dark:text-white">
            <input type="text" x-model="regLastName" placeholder="{% trans 'Last name' %}" class="w-full rounded-xl border border-slate-200 bg-slate-50 px-4 py-2.5 text-sm dark:border-slate-600 dark:bg-slate-800 dark:text-white">
          </div>
          <input type="email" x-model="regEmail" placeholder="{% trans 'Email' %}" class="w-full rounded-xl border border-slate-200 bg-slate-50 px-4 py-2.5 text-sm dark:border-slate-600 dark:bg-slate-800 dark:text-white">
          <input type="tel" x-model="regPhone" placeholder="{% trans 'Phone' %}" class="w-full rounded-xl border border-slate-200 bg-slate-50 px-4 py-2.5 text-sm dark:border-slate-600 dark:bg-slate-800 dark:text-white">
          <input type="text" x-model="regAddress" placeholder="{% trans 'Address (optional)' %}" class="w-full rounded-xl border border-slate-200 bg-slate-50 px-4 py-2.5 text-sm dark:border-slate-600 dark:bg-slate-800 dark:text-white">
          <input type="password" x-model="regPassword" placeholder="{% trans 'Password (min 6 chars)' %}" class="w-full rounded-xl border border-slate-200 bg-slate-50 px-4 py-2.5 text-sm dark:border-slate-600 dark:bg-slate-800 dark:text-white">
          <p x-show="authError" x-text="authError" class="rounded-lg bg-rose-50 px-3 py-2 text-xs font-semibold text-rose-700 dark:bg-rose-900/30 dark:text-rose-300"></p>
          <button @click="doRegister()" :disabled="authLoading" class="w-full rounded-xl bg-emerald-600 py-3 text-sm font-bold text-white hover:bg-emerald-700 disabled:opacity-50">
            <span x-show="!authLoading">{% trans "Create account" %}</span>
            <span x-show="authLoading">{% trans "Creating..." %}</span>
          </button>
        </div>
      </template>
      <template x-if="authMode === 'forgot'">
        <div class="space-y-3">
          <p class="text-sm text-slate-600 dark:text-slate-300">{% trans "Enter your account email. We'll send a 6-digit code to reset your password." %}</p>
          <input type="email" x-model="forgotEmail" placeholder="{% trans 'Email' %}" class="w-full rounded-xl border border-slate-200 bg-slate-50 px-4 py-2.5 text-sm dark:border-slate-600 dark:bg-slate-800 dark:text-white">
          <p x-show="authError" x-text="authError" class="rounded-lg bg-rose-50 px-3 py-2 text-xs font-semibold text-rose-700 dark:bg-rose-900/30 dark:text-rose-300"></p>
          <button @click="doForgot()" :disabled="authLoading" class="w-full rounded-xl bg-orange-600 py-3 text-sm font-bold text-white hover:bg-orange-700 disabled:opacity-50">
            <span x-show="!authLoading">{% trans "Send code" %}</span>
            <span x-show="authLoading">{% trans "Sending..." %}</span>
          </button>
          <button type="button" @click="authMode = 'login'; authError = ''" class="w-full text-center text-xs font-semibold text-slate-600 hover:underline dark:text-slate-300">{% trans "Back to login" %}</button>
        </div>
      </template>
      <template x-if="authMode === 'reset_code'">
        <div class="space-y-3">
          <p class="text-sm text-slate-600 dark:text-slate-300">
            {% trans "Enter the 6-digit code sent to" %} <span class="font-bold" x-text="forgotEmail"></span> {% trans "and choose a new password." %}
          </p>
          <input type="text" inputmode="numeric" maxlength="6" x-model="resetCode" placeholder="{% trans '6-digit code' %}" class="w-full rounded-xl border border-slate-200 bg-slate-50 px-4 py-2.5 text-center tracking-[0.5em] text-lg font-black dark:border-slate-600 dark:bg-slate-800 dark:text-white">
          <input type="password" x-model="resetNewPassword" placeholder="{% trans 'New password (min 6 chars)' %}" class="w-full rounded-xl border border-slate-200 bg-slate-50 px-4 py-2.5 text-sm dark:border-slate-600 dark:bg-slate-800 dark:text-white">
          <p x-show="authError" x-text="authError" class="rounded-lg bg-rose-50 px-3 py-2 text-xs font-semibold text-rose-700 dark:bg-rose-900/30 dark:text-rose-300"></p>
          <p x-show="authInfo" x-text="authInfo" class="rounded-lg bg-emerald-50 px-3 py-2 text-xs font-semibold text-emerald-700 dark:bg-emerald-900/30 dark:text-emerald-300"></p>
          <button @click="doReset()" :disabled="authLoading" class="w-full rounded-xl bg-orange-600 py-3 text-sm font-bold text-white hover:bg-orange-700 disabled:opacity-50">
            <span x-show="!authLoading">{% trans "Reset password" %}</span>
            <span x-show="authLoading">{% trans "Resetting..." %}</span>
          </button>
          <button type="button" @click="authMode = 'forgot'; authError = ''" class="w-full text-center text-xs font-semibold text-slate-600 hover:underline dark:text-slate-300">{% trans "Resend code" %}</button>
        </div>
      </template>
    </div>
  </div>
  </template>

  <!-- Profile modal (teleported) -->
  <template x-teleport="body">
  <div x-cloak x-show="profileOpen && currentUser" class="fixed inset-0 z-[9998] overflow-y-auto bg-slate-900/70 p-4" @click.self="profileOpen = false">
    <div class="mx-auto my-8 w-full max-w-lg rounded-2xl bg-white p-6 shadow-2xl dark:bg-slate-900" @click.stop>
      <div class="mb-4 flex items-center justify-between">
        <h3 class="text-lg font-black text-slate-900 dark:text-white">{% trans "My profile" %}</h3>
        <button @click="profileOpen = false" class="rounded-lg p-1 text-slate-500 hover:bg-slate-100 dark:hover:bg-slate-800">✕</button>
      </div>
      <div class="space-y-3">
        <div class="grid grid-cols-2 gap-2">
          <input type="text" x-model="profileEdits.first_name" placeholder="{% trans 'First name' %}" class="w-full rounded-xl border border-slate-200 bg-slate-50 px-3 py-2 text-sm dark:border-slate-600 dark:bg-slate-800 dark:text-white">
          <input type="text" x-model="profileEdits.last_name" placeholder="{% trans 'Last name' %}" class="w-full rounded-xl border border-slate-200 bg-slate-50 px-3 py-2 text-sm dark:border-slate-600 dark:bg-slate-800 dark:text-white">
        </div>
        <input type="email" x-model="profileEdits.email" placeholder="{% trans 'Email' %}" class="w-full rounded-xl border border-slate-200 bg-slate-50 px-3 py-2 text-sm dark:border-slate-600 dark:bg-slate-800 dark:text-white">
        <input type="tel" x-model="profileEdits.phone" placeholder="{% trans 'Phone' %}" class="w-full rounded-xl border border-slate-200 bg-slate-50 px-3 py-2 text-sm dark:border-slate-600 dark:bg-slate-800 dark:text-white">
        <p x-show="profileMessage" x-text="profileMessage" class="rounded-lg bg-slate-100 px-3 py-2 text-xs font-semibold text-slate-700 dark:bg-slate-800 dark:text-slate-300"></p>
        <button @click="saveProfile()" :disabled="profileSaving" class="w-full rounded-xl bg-orange-600 py-2.5 text-sm font-bold text-white hover:bg-orange-700 disabled:opacity-50">
          <span x-show="!profileSaving">{% trans "Save changes" %}</span>
          <span x-show="profileSaving">{% trans "Saving..." %}</span>
        </button>
      </div>
      <div class="mt-6 border-t border-slate-200 pt-4 dark:border-slate-700">
        <h4 class="mb-3 text-sm font-black text-slate-800 dark:text-slate-100">{% trans "My addresses" %}</h4>
        <template x-if="!(currentUser?.addresses || []).length">
          <p class="mb-3 text-sm text-slate-500 dark:text-slate-400">{% trans "No addresses saved yet." %}</p>
        </template>
        <ul class="space-y-2">
          <template x-for="a in (currentUser?.addresses || [])" :key="a.id">
            <li class="rounded-xl border border-slate-200 bg-slate-50 p-3 dark:border-slate-700 dark:bg-slate-800">
              <div class="flex items-start justify-between gap-2">
                <div class="min-w-0 flex-1">
                  <p class="text-sm font-bold text-slate-900 dark:text-white" x-text="a.label || '{% trans "Address" %}'"></p>
                  <p class="text-sm text-slate-600 dark:text-slate-300" x-text="a.address"></p>
                </div>
                <div class="flex shrink-0 flex-col items-end gap-1">
                  <span x-show="a.is_default" class="rounded-full bg-emerald-100 px-2 py-0.5 text-[10px] font-black text-emerald-700 dark:bg-emerald-900/40 dark:text-emerald-300">{% trans "Default" %}</span>
                  <button x-show="!a.is_default" @click="setDefaultAddress(a.id)" class="text-xs font-bold text-orange-600 hover:underline">{% trans "Set default" %}</button>
                  <button @click="deleteAddress(a.id)" class="text-xs font-bold text-rose-600 hover:underline">{% trans "Delete" %}</button>
                </div>
              </div>
            </li>
          </template>
        </ul>
        <div class="mt-3 space-y-2">
          <input type="text" x-model="newAddressLabel" placeholder="{% trans 'Label (e.g. Home, Work)' %}" class="w-full rounded-xl border border-slate-200 bg-white px-3 py-2 text-sm dark:border-slate-600 dark:bg-slate-900 dark:text-white">
          <input type="text" x-model="newAddressText" placeholder="{% trans 'Street, number, city' %}" class="w-full rounded-xl border border-slate-200 bg-white px-3 py-2 text-sm dark:border-slate-600 dark:bg-slate-900 dark:text-white">
          <button @click="addAddress()" :disabled="newAddressSaving || !newAddressText.trim()" class="w-full rounded-xl bg-emerald-600 py-2 text-sm font-bold text-white hover:bg-emerald-700 disabled:opacity-50">
            <span x-show="!newAddressSaving">{% trans "Add address" %}</span>
            <span x-show="newAddressSaving">{% trans "Saving..." %}</span>
          </button>
        </div>
      </div>
    </div>
  </div>
  </template>

  <!-- Orders modal (teleported) -->
  <template x-teleport="body">
  <div x-cloak x-show="ordersOpen && currentUser" class="fixed inset-0 z-[9998] overflow-y-auto bg-slate-900/70 p-4" @click.self="ordersOpen = false">
    <div class="mx-auto my-8 w-full max-w-2xl rounded-2xl bg-white p-6 shadow-2xl dark:bg-slate-900" @click.stop>
      <div class="mb-4 flex items-center justify-between">
        <h3 class="text-lg font-black text-slate-900 dark:text-white">{% trans "My orders" %}</h3>
        <button @click="ordersOpen = false" class="rounded-lg p-1 text-slate-500 hover:bg-slate-100 dark:hover:bg-slate-800">✕</button>
      </div>
      <p class="mb-3 text-xs text-slate-500 dark:text-slate-400">{% trans "Open a restaurant to view its order-tracking page for full status and cancellation." %}</p>
      <template x-if="ordersLoading">
        <p class="py-8 text-center text-sm text-slate-500 dark:text-slate-400">{% trans "Loading..." %}</p>
      </template>
      <template x-if="!ordersLoading && !ordersList.length">
        <p class="py-8 text-center text-sm text-slate-500 dark:text-slate-400">{% trans "No orders yet." %}</p>
      </template>
      <ul class="space-y-2">
        <template x-for="o in ordersList" :key="o.id">
          <li class="flex items-center justify-between rounded-xl border border-slate-200 bg-slate-50 px-4 py-3 text-sm dark:border-slate-700 dark:bg-slate-800">
            <div>
              <p class="font-bold text-slate-900 dark:text-white">#<span x-text="o.id"></span> · <span x-text="o.currency || 'EUR'"></span> <span x-text="o.total_amount"></span></p>
              <p class="text-xs text-slate-500 dark:text-slate-400" x-text="new Date(o.created_at).toLocaleString()"></p>
            </div>
            <span class="rounded-full px-2 py-1 text-xs font-black capitalize" :class="['completed','paid'].includes(o.status) ? 'bg-emerald-100 text-emerald-700 dark:bg-emerald-900/30 dark:text-emerald-300' : (o.status === 'cancelled' || o.status === 'refunded' ? 'bg-rose-100 text-rose-700 dark:bg-rose-900/30 dark:text-rose-300' : 'bg-orange-100 text-orange-700 dark:bg-orange-900/30 dark:text-orange-300')" x-text="o.status"></span>
          </li>
        </template>
      </ul>
    </div>
  </div>
  </template>
</header>

<script>
  function customerNavbar() {
    return {
      apiBase: '/api/business-menu',
      currentUser: null,
      userMenuOpen: false,
      authOpen: false,
      authMode: 'login',
      authIdentifier: '',
      authPassword: '',
      authError: '',
      authInfo: '',
      authLoading: false,
      forgotEmail: '',
      resetCode: '',
      resetNewPassword: '',
      regFirstName: '', regLastName: '', regEmail: '', regPhone: '', regPassword: '', regAddress: '',
      profileOpen: false,
      profileEdits: { first_name: '', last_name: '', email: '', phone: '' },
      profileSaving: false,
      profileMessage: '',
      newAddressText: '',
      newAddressLabel: '',
      newAddressSaving: false,
      ordersOpen: false,
      ordersList: [],
      ordersLoading: false,
      _csrf() { return document.querySelector('[name=csrfmiddlewaretoken]')?.value || (document.cookie.split('; ').find(r => r.startsWith('csrftoken=')) || '').split('=')[1] || ''; },
      async init() {
        await this.fetchMe();
        this.$watch('ordersOpen', v => { if (v) this.fetchOrders(); });
      },
      async fetchMe() {
        try {
          const r = await fetch(this.apiBase + '/customer/me/', { credentials: 'same-origin' });
          if (r.ok) {
            this.currentUser = await r.json();
            this.profileEdits = {
              first_name: this.currentUser.first_name || '',
              last_name: this.currentUser.last_name || '',
              email: this.currentUser.email || '',
              phone: this.currentUser.phone || '',
            };
            window.__menuCustomer = this.currentUser;
            window.dispatchEvent(new CustomEvent('menu-customer-changed', { detail: this.currentUser }));
          } else {
            this.currentUser = null;
            window.__menuCustomer = null;
            window.dispatchEvent(new CustomEvent('menu-customer-changed', { detail: null }));
          }
        } catch (e) { this.currentUser = null; }
      },
      openAuthModal(mode) { this.authMode = mode || 'login'; this.authError = ''; this.authOpen = true; },
      async doLogin() {
        this.authError = '';
        if (!this.authIdentifier || !this.authPassword) { this.authError = '{% trans "Please enter your email/phone and password." %}'; return; }
        this.authLoading = true;
        try {
          const r = await fetch(this.apiBase + '/customer/login/', {
            method: 'POST', credentials: 'same-origin',
            headers: { 'Content-Type': 'application/json', 'X-CSRFToken': this._csrf() },
            body: JSON.stringify({ identifier: this.authIdentifier, password: this.authPassword }),
          });
          const data = await r.json().catch(() => ({}));
          if (!r.ok) {
            const loginMap = {
              invalid_credentials: '{% trans "Invalid email/phone or password. Please try again or use \"Forgot password\"." %}',
              credentials_required: '{% trans "Please enter both your email/phone and your password." %}',
              server_error: '{% trans "Server error. Please try again in a moment." %}',
            };
            this.authError = loginMap[data.detail]
              || (data.message ? (data.detail || 'error') + ': ' + data.message : '')
              || (data.detail ? String(data.detail) : '')
              || ('{% trans "Login failed." %}' + ' (HTTP ' + r.status + ')');
          } else {
            this.currentUser = data;
            this.profileEdits = { first_name: data.first_name || '', last_name: data.last_name || '', email: data.email || '', phone: data.phone || '' };
            this.authOpen = false;
            this.authPassword = '';
            window.__menuCustomer = data;
            window.dispatchEvent(new CustomEvent('menu-customer-changed', { detail: data }));
          }
        } catch (e) { this.authError = '{% trans "Network error" %}'; }
        this.authLoading = false;
      },
      async doRegister() {
        this.authError = '';
        if (!this.regFirstName || !this.regEmail || !this.regPhone || !this.regPassword) { this.authError = '{% trans "Please fill in the required fields." %}'; return; }
        if (this.regPassword.length < 6) { this.authError = '{% trans "Password must be at least 6 characters." %}'; return; }
        this.authLoading = true;
        try {
          const r = await fetch(this.apiBase + '/customer/register/', {
            method: 'POST', credentials: 'same-origin',
            headers: { 'Content-Type': 'application/json', 'X-CSRFToken': this._csrf() },
            body: JSON.stringify({
              first_name: this.regFirstName, last_name: this.regLastName,
              email: this.regEmail, phone: this.regPhone,
              password: this.regPassword, address: this.regAddress,
            }),
          });
          const data = await r.json().catch(() => ({}));
          if (!r.ok) {
            const map = {
              phone_already_registered: '{% trans "This phone number is already registered. We switched you to Log in — please enter your password." %}',
              email_already_registered: '{% trans "This email is already registered. We switched you to Log in — please enter your password." %}',
              invalid_email: '{% trans "Please enter a valid email address (e.g. name@example.com)." %}',
              password_min_6: '{% trans "Password must be at least 6 characters." %}',
              first_name_required: '{% trans "First name is required." %}',
              phone_required: '{% trans "Phone number is required." %}',
              server_error: '{% trans "Server error while creating your account. Please try again." %}',
            };
            if (data.detail === 'phone_already_registered' || data.detail === 'email_already_registered') {
              this.authMode = 'login';
              this.authIdentifier = data.detail === 'phone_already_registered' ? this.regPhone : this.regEmail;
            }
            this.authError = map[data.detail]
              || (data.message ? (data.detail || 'error') + ': ' + data.message : '')
              || (data.detail ? String(data.detail) : '')
              || ('{% trans "Registration failed." %}' + ' (HTTP ' + r.status + ')');
          } else {
            this.currentUser = data;
            this.profileEdits = { first_name: data.first_name || '', last_name: data.last_name || '', email: data.email || '', phone: data.phone || '' };
            this.authOpen = false;
            this.regPassword = '';
            window.__menuCustomer = data;
            window.dispatchEvent(new CustomEvent('menu-customer-changed', { detail: data }));
          }
        } catch (e) { this.authError = '{% trans "Network error" %}'; }
        this.authLoading = false;
      },
      async doForgot() {
        this.authError = ''; this.authInfo = '';
        const email = String(this.forgotEmail || '').trim().toLowerCase();
        if (!email || !email.includes('@')) { this.authError = '{% trans "Please enter a valid email." %}'; return; }
        this.authLoading = true;
        try {
          const r = await fetch(this.apiBase + '/customer/forgot-password/', {
            method: 'POST', credentials: 'same-origin',
            headers: { 'Content-Type': 'application/json', 'X-CSRFToken': this._csrf() },
            body: JSON.stringify({ email }),
          });
          if (r.ok) {
            this.authMode = 'reset_code';
            this.authInfo = '{% trans "If the email exists, a code has been sent." %}';
          } else {
            const data = await r.json().catch(() => ({}));
            this.authError = data.detail || '{% trans "Could not send code." %}';
          }
        } catch (e) { this.authError = '{% trans "Network error" %}'; }
        this.authLoading = false;
      },
      async doReset() {
        this.authError = ''; this.authInfo = '';
        const code = String(this.resetCode || '').trim();
        const pw = String(this.resetNewPassword || '').trim();
        if (code.length !== 6) { this.authError = '{% trans "Enter the 6-digit code." %}'; return; }
        if (pw.length < 6) { this.authError = '{% trans "Password must be at least 6 characters." %}'; return; }
        this.authLoading = true;
        try {
          const r = await fetch(this.apiBase + '/customer/reset-password/', {
            method: 'POST', credentials: 'same-origin',
            headers: { 'Content-Type': 'application/json', 'X-CSRFToken': this._csrf() },
            body: JSON.stringify({ email: this.forgotEmail, code, new_password: pw }),
          });
          const data = await r.json().catch(() => ({}));
          if (!r.ok) {
            this.authError = data.detail === 'invalid_or_expired_code'
              ? '{% trans "Invalid or expired code." %}'
              : (data.detail === 'password_min_6' ? '{% trans "Password must be at least 6 characters." %}' : (data.detail || '{% trans "Reset failed." %}'));
          } else {
            this.authMode = 'login';
            this.authIdentifier = this.forgotEmail;
            this.authPassword = pw;
            this.resetCode = ''; this.resetNewPassword = '';
            this.authInfo = '{% trans "Password reset. You can log in now." %}';
          }
        } catch (e) { this.authError = '{% trans "Network error" %}'; }
        this.authLoading = false;
      },
      async doLogout() {
        try {
          await fetch(this.apiBase + '/customer/logout/', {
            method: 'POST', credentials: 'same-origin',
            headers: { 'Content-Type': 'application/json', 'X-CSRFToken': this._csrf() },
          });
        } catch (e) {}
        this.currentUser = null;
        this.userMenuOpen = false;
        window.__menuCustomer = null;
        window.dispatchEvent(new CustomEvent('menu-customer-changed', { detail: null }));
      },
      async saveProfile() {
        if (!this.currentUser) return;
        this.profileSaving = true; this.profileMessage = '';
        try {
          const patch = {};
          for (const k of ['first_name', 'last_name', 'email', 'phone']) {
            if (this.profileEdits[k] !== this.currentUser[k]) patch[k] = this.profileEdits[k];
          }
          if (!Object.keys(patch).length) { this.profileMessage = '{% trans "No changes to save." %}'; this.profileSaving = false; return; }
          const r = await fetch(this.apiBase + '/customer/me/', {
            method: 'PATCH', credentials: 'same-origin',
            headers: { 'Content-Type': 'application/json', 'X-CSRFToken': this._csrf() },
            body: JSON.stringify(patch),
          });
          const data = await r.json().catch(() => ({}));
          if (!r.ok) { this.profileMessage = data.detail || '{% trans "Update failed." %}'; }
          else { this.currentUser = data; this.profileMessage = '{% trans "Profile updated." %}'; window.__menuCustomer = data; }
        } catch (e) { this.profileMessage = '{% trans "Network error" %}'; }
        this.profileSaving = false;
      },
      async addAddress() {
        const addr = String(this.newAddressText || '').trim();
        if (!addr || !this.currentUser) return;
        this.newAddressSaving = true;
        try {
          const r = await fetch(this.apiBase + '/customer/addresses/', {
            method: 'POST', credentials: 'same-origin',
            headers: { 'Content-Type': 'application/json', 'X-CSRFToken': this._csrf() },
            body: JSON.stringify({ address: addr, label: this.newAddressLabel }),
          });
          if (r.ok) { this.newAddressText = ''; this.newAddressLabel = ''; await this.fetchMe(); }
        } catch (e) {}
        this.newAddressSaving = false;
      },
      async setDefaultAddress(id) {
        try {
          await fetch(this.apiBase + '/customer/addresses/' + id + '/', {
            method: 'PATCH', credentials: 'same-origin',
            headers: { 'Content-Type': 'application/json', 'X-CSRFToken': this._csrf() },
            body: JSON.stringify({ is_default: true }),
          });
          await this.fetchMe();
        } catch (e) {}
      },
      async deleteAddress(id) {
        try {
          await fetch(this.apiBase + '/customer/addresses/' + id + '/', {
            method: 'DELETE', credentials: 'same-origin',
            headers: { 'X-CSRFToken': this._csrf() },
          });
          await this.fetchMe();
        } catch (e) {}
      },
      async fetchOrders() {
        if (!this.currentUser) return;
        this.ordersLoading = true;
        try {
          const rid = window.__customerRestaurantId || '';
          const url = rid
            ? (this.apiBase + '/orders/lookup/?restaurant_id=' + rid)
            : (this.apiBase + '/orders/lookup/?phone=' + encodeURIComponent(this.currentUser.phone));
          const r = await fetch(url, { credentials: 'same-origin' });
          const data = await r.json().catch(() => ({}));
          this.ordersList = data.orders || [];
        } catch (e) { this.ordersList = []; }
        this.ordersLoading = false;
      },
    };
  }
</script>
